task_name: "Cable_Verification_Task"

hardware_setup:
  receiver: "keysight_n9030b"         # Папка приемника в hardware_library
  cable_system: "sucoflex_11m"        # Папка кабеля в hardware_library

# ЦЕНТРАЛИЗОВАННЫЕ НАСТРОЙКИ ЭКСПОРТА КОРРЕКЦИЙ В ЗАДАЧЕ
hardware_corrections_output:
  generate_corrections: true          # Включить модуль генерации файлов

  devices_to_export:
    cable_system:                     # Ссылаемся на роль в схеме
      export: true
      target_parameter: "S21"         # Какой параметр выгружаем
      invert_sign: true               # Преобразуем затухание в Loss (умножаем на -1)
      frequency_grid_type: "custom_list"      # Метод: фиксированный список частот
      custom_frequencies_unit: "MHz"
      custom_frequencies: [ 0.15, 1.0, 10.0, 30.0, 100.0, 500.0, 1000.0, 18000.0, 40000.0 ]

    receiver:
      export: true
      target_parameter: "Sine_Accuracy"
      invert_sign: true
      frequency_grid_type: calibration_points


    # РЕЖИМ 1: Формирование сетки по фиксированному количеству точек (By Points Count)

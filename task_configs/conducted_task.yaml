task_name: "Cable_Verification_Task"

hardware_setup:
  receiver: "keysight_n9030b"         # Папка приемника в hardware_library
  cable_system: "sucoflex_11m"        # Папка кабеля в hardware_library

# ЦЕНТРАЛИЗОВАННЫЕ НАСТРОЙКИ ЭКСПОРТА КОРРЕКЦИЙ В ЗАДАЧЕ
hardware_corrections_output:
  generate_corrections: true          # Включить модуль генерации файлов

  devices_to_export:
    cable_system:                     # Ссылаемся на роль в схеме
      export: true
      target_parameter: "S21"         # Какой параметр выгружаем
      invert_sign: true               # 💡 ИНВЕРСИЯ ТЕПЕРЬ ТУТ: преобразуем затухание в Loss (умножаем на -1)
      step_mode: "logspace"           # Логарифмический шаг частоты
      points_count: 30               # Количество точек коррекции


# Настройки графиков
plots_output:
  generate_plots: true
  items:
    - device_id: "cable_system"       # Ссылаемся на ключ из hardware_setup (cable_system??) (Cable_11m??)
      parameter: "S21"
      show_uncertainty: true
      sub_plots:
        - title: "SUCOFLEX 11m - 100кГц...1МГц (Linear)"
          freq_min_hz: 100000         # 100 кГц
          freq_max_hz: 1000000        # 1 МГц
          x_scale: "linear"              # "log" / "linear"
          show_limit_line: true
          limit_value_db: -1.0

        - title: "SUCOFLEX 11m - 1МГц...10МГц (Linear)"
          freq_min_hz: 1000000        # 1 МГц
          freq_max_hz: 10000000       # 10 МГц
          x_scale: "linear"
          show_limit_line: false

        - title: "SUCOFLEX 11m - 10МГц...100МГц (Linear)"
          freq_min_hz: 10000000        # 10 МГц
          freq_max_hz: 100000000       # 100 МГц
          x_scale: "linear"
          show_limit_line: false

        - title: "SUCOFLEX 11m - 100МГц...1000МГц (Linear)"
          freq_min_hz: 100000000        # 100 МГц
          freq_max_hz: 1000000000       # 1000 МГц
          x_scale: "linear"
          show_limit_line: false

        - title: "SUCOFLEX 11m - 1ГГц...10ГГц (Linear)"
          freq_min_hz: 1000000000        # 1000 МГц
          freq_max_hz: 10000000000       # 10000 МГц
          x_scale: "linear"
          show_limit_line: false

        - title: "SUCOFLEX 11m - 10ГГц...40ГГц (Linear)"
          freq_min_hz: 10000000000        # 10000 МГц
          freq_max_hz: 40000000000        # 40000 МГц
          x_scale: "linear"
          show_limit_line: false

